name: "QA"

on:
  pull_request:
    branches:
      - main
    paths-ignore:
      - 'docs/**'
  push:
    branches:
      - main
    paths-ignore:
      - 'docs/**'

concurrency:
  # A push to main gets its own group, so one merged after another is not cancelled while it waits.
  group: ${{ github.workflow }}-${{ github.ref != 'refs/heads/main' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  qa:
    name: "QA"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        version: ['1.10', '1']
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: ${{ matrix.version }}
      - uses: julia-actions/cache@v3
      - name: "Instantiate test/qa"
        run: |
          julia --project=test/qa -e '
            using Pkg
            Pkg.develop(path=".")
            Pkg.instantiate()'
      - name: "Run QA tests"
        run: julia --project=test/qa test/qa/qa.jl
