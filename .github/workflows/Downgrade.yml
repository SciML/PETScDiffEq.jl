name: Downgrade
on:
  pull_request:
    branches:
      - main
    paths-ignore:
      - 'docs/**'
  push:
    branches:
      - main
    paths-ignore:
      - 'docs/**'
jobs:
  downgrade:
    name: "Downgrade"
    strategy:
      fail-fast: false
      matrix:
        group: [Core, MPI]
    uses: "SciML/.github/.github/workflows/downgrade.yml@v1"
    with:
      mode: "deps"
      group: "${{ matrix.group }}"
    secrets: "inherit"
